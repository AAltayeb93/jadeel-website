# .pages.yml — إعداد PagesCMS (app.pagescms.org) لموقع جديل
# مُولّد تلقائيًا من بنية المحتوى. لإعادة التوليد: node scripts/gen-pagescms.mjs
media:
  input: "public/images"
  output: "/images"
content:
  - name: "articles"
    label: "المقالات"
    type: "collection"
    path: "src/content/articles"
    filename: "{fields.locale}-{year}{month}{day}{hour}{minute}.md"
    view:
      fields:
        - "title"
        - "locale"
        - "date"
    fields:
      - name: "title"
        label: "العنوان"
        type: "string"
      - name: "description"
        label: "الوصف"
        type: "text"
      - name: "locale"
        label: "اللغة"
        type: "select"
        options:
          values:
            - value: "ar"
              label: "عربي"
            - value: "en"
              label: "English"
        default: "ar"
      - name: "date"
        label: "التاريخ"
        type: "date"
      - name: "category"
        label: "التصنيف"
        type: "string"
        required: false
      - name: "readingTime"
        label: "مدة القراءة"
        type: "string"
        required: false
      - name: "body"
        label: "نص المقال"
        type: "rich-text"
  - name: "content_ar"
